[package]
name = "ruby-templates-ls"
version = "0.1.0"
edition = "2021"
description = "Language server for ERB, Haml and Slim templates"
license = "MIT"

[[bin]]
name = "ruby-templates-ls"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tree-sitter = "0.25"
tree-sitter-embedded-template = "0.25"
dashmap = "6"
regex = "1"
once_cell = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
