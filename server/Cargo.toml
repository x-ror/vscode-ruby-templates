[package]
name = "ruby-templates-ls"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Language server for ERB, Haml and Slim templates"
license = "MIT"

[lib]
name = "ruby_templates"
path = "src/lib.rs"

[[bin]]
name = "ruby-templates-ls"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "time",
] }
tree-sitter = "0.27"
tree-sitter-embedded-template = "0.25"
tree-sitter-ruby = "0.23"
dashmap = "6"
regex = "1"
walkdir = "2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
