[package]
name = "ruby-templates-ls"
version = "0.16.0"
edition = "2021"
rust-version = "1.85"
description = "Language server for ERB, Haml and Slim templates"
license = "MIT"

[lib]
name = "ruby_templates"
path = "src/lib.rs"

[[bin]]
name = "ruby-templates-ls"
path = "src/main.rs"

[[bin]]
name = "ruby-templates"
path = "src/bin/ruby-templates.rs"

[dependencies]
tower-lsp-server = "0.23"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "io-std",
  "time",
] }
dashmap = "6"
regex = "1"
walkdir = "2"
serde_json = "1"
ruby-prism = "=2.1.0"
toml = { version = "1.0.7", default-features = false, features = [
  "parse",
  "std",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
