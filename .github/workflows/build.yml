name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:

jobs:
  server:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  dir: linux-x64,  ext: '' }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, dir: linux-arm64, ext: '', cross: true }
          - { os: macos-14,       target: aarch64-apple-darwin,      dir: darwin-arm64, ext: '' }
          - { os: macos-13,       target: x86_64-apple-darwin,       dir: darwin-x64, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    dir: win32-x64,  ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        working-directory: server
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}
      - name: Test
        if: ${{ !matrix.cross }}
        working-directory: server
        run: cargo test --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.dir }}
          path: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }}

  extension:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Lay out per-platform binaries
        run: |
          for d in artifacts/server-*; do
            plat=${d#artifacts/server-}
            mkdir -p bin/$plat
            cp $d/* bin/$plat/
            chmod +x bin/$plat/* || true
          done
      - run: npm ci
      - run: npm run test:tokens
      - name: Package one .vsix per platform
        run: |
          for plat in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            [ -d bin/$plat ] || continue
            mkdir -p .pkg && rm -rf .pkg/bin && mkdir -p .pkg/bin && cp -r bin/$plat .pkg/bin/
            npx @vscode/vsce package --target $plat --out ruby-templates-$plat.vsix
          done
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: '*.vsix' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: '*.vsix' }
