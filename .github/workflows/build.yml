name: build
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:

# A new push to a PR supersedes its running build; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: Known vulnerabilities in Rust dependencies
        working-directory: server
        run: cargo audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run format:check

  server:
    strategy:
      matrix:
        include:
          # Pinned: the binary needs at least the glibc it was built with, and ubuntu-latest is moving to 26.04.
          - {
              os: ubuntu-24.04,
              target: x86_64-unknown-linux-gnu,
              dir: linux-x64,
              ext: "",
              test: true,
            }
          - {
              os: ubuntu-latest,
              target: aarch64-unknown-linux-gnu,
              dir: linux-arm64,
              ext: "",
              cross: true,
            }
          - {
              os: macos-14,
              target: aarch64-apple-darwin,
              dir: darwin-arm64,
              ext: "",
              test: true,
            }
          # Cross-built on Apple silicon; darwin-arm64 runs the macOS tests.
          - {
              os: macos-14,
              target: x86_64-apple-darwin,
              dir: darwin-x64,
              ext: "",
            }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              dir: win32-x64,
              ext: ".exe",
              test: true,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, key: "${{ matrix.target }}" }
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with: { tool: cross }
      - name: Build
        working-directory: server
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        working-directory: server
        run: cargo test --release --target ${{ matrix.target }}
      - name: Check samples
        if: matrix.test
        shell: bash
        run: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }} --check test/sample.*
      - uses: oven-sh/setup-bun@v2
        if: matrix.test
      - name: LSP end to end
        if: matrix.test
        run: bun test/e2e.js
        env:
          RUBY_TEMPLATES_LS: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }}
      - name: Command line
        if: matrix.test
        run: bun test/cli.js
        env:
          RUBY_TEMPLATES: server/target/${{ matrix.target }}/release/ruby-templates${{ matrix.ext }}
      - name: npm package
        if: matrix.test
        run: bun test/npm.js
        env:
          RUBY_TEMPLATES: server/target/${{ matrix.target }}/release/ruby-templates${{ matrix.ext }}
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.dir }}
          path: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }}
      # The command line goes to npm, not into the .vsix.
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.dir }}
          path: server/target/${{ matrix.target }}/release/ruby-templates${{ matrix.ext }}

  extension:
    needs: [lint, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # One .pkg/server-<platform>/ per build; artifacts lose the executable bit.
      - uses: actions/download-artifact@v8
        with: { pattern: server-*, path: .pkg }
      - run: chmod +x .pkg/*/* && mkdir -p bin && cp -r .pkg/server-linux-x64 bin/linux-x64
      - run: bun install --frozen-lockfile
      - run: bun run test:tokens
      - run: bun run test:snippets
      - run: bun run test:unit
      - run: bun run test:slim
      # Commands and the language server inside a downloaded VS Code; tools that aren't installed are skipped.
      - run: xvfb-run -a bun run test:vscode
      - name: Package one .vsix per platform
        # vsce packs all of bin/, so it holds only the target's binary while that target is packaged.
        run: |
          bun run build
          for d in .pkg/server-*; do
            plat=${d#.pkg/server-}
            rm -rf bin && mkdir -p bin && cp -r $d bin/$plat
            bunx @vscode/vsce package --no-dependencies --target $plat --out ruby-templates-$plat.vsix
          done
      - uses: actions/upload-artifact@v7
        with: { name: vsix, path: "*.vsix" }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with: { files: "*.vsix" }

  # The npm packages: one per platform with its binary, and the main package with the bin wrapper.
  npm:
    needs: [lint, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with: { pattern: cli-*, path: .cli }
      - run: bun npm/assemble.js .cli npm-dist
      - uses: actions/upload-artifact@v7
        with: { name: npm, path: npm-dist }

  # npm trusted publishing: no token, npm trusts this repository and workflow file (needs npm 11.5+). Platform
  # packages first, so the main package's optional dependencies exist when it appears.
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@v8
        with: { name: npm, path: npm-dist }
      # Artifacts lose the executable bit.
      - run: chmod +x npm-dist/*/bin/ruby-templates*
      - run: for dir in npm-dist/*/; do [ "$dir" = npm-dist/main/ ] || npm publish --provenance --access public "$dir"; done
      - run: npm publish --provenance --access public npm-dist/main

  # Each registry gets its own job, so one failing doesn't block the other.
  publish-marketplace:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with: { name: vsix }
      - run: for vsix in *.vsix; do bunx @vscode/vsce publish --packagePath "$vsix"; done
        env: { VSCE_PAT: "${{ secrets.VSCE_PAT }}" }

  # Open VSX trusted publishing: no token, the registry trusts this repository and workflow file.
  publish-open-vsx:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with: { name: vsix }
      - run: for vsix in *.vsix; do bunx ovsx publish --trusted-publishing "$vsix"; done
