name: build
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:

# A new push to a PR supersedes its running build; main and tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: Known vulnerabilities in Rust dependencies
        working-directory: server
        run: cargo audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server }
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check

  server:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  dir: linux-x64,    ext: '',     test: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, dir: linux-arm64,  ext: '',     cross: true }
          - { os: macos-14,       target: aarch64-apple-darwin,      dir: darwin-arm64, ext: '',     test: true }
          # Cross-built on Apple silicon; darwin-arm64 runs the macOS tests.
          - { os: macos-14,       target: x86_64-apple-darwin,       dir: darwin-x64,   ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    dir: win32-x64,    ext: '.exe', test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: server, key: "${{ matrix.target }}" }
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with: { tool: cross }
      - name: Build
        working-directory: server
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        working-directory: server
        run: cargo test --release --target ${{ matrix.target }}
      - name: Check samples
        if: matrix.test
        shell: bash
        run: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }} --check test/sample.*
      - uses: actions/setup-node@v4
        if: matrix.dir == 'linux-x64'
        with: { node-version: 22 }
      # e2e builds `file://` URIs from POSIX temp paths; macOS's /var symlink and Windows paths are untested.
      - name: LSP end to end
        if: matrix.dir == 'linux-x64'
        run: node test/e2e.js
        env:
          RUBY_TEMPLATES_LS: server/target/${{ matrix.target }}/release/ruby-templates-ls
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.dir }}
          path: server/target/${{ matrix.target }}/release/ruby-templates-ls${{ matrix.ext }}

  extension:
    needs: [lint, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # One .pkg/server-<platform>/ per build; artifacts lose the executable bit.
      - uses: actions/download-artifact@v4
        with: { pattern: server-*, path: .pkg }
      - run: chmod +x .pkg/*/* && mkdir -p bin && cp -r .pkg/server-linux-x64 bin/linux-x64
      - run: npm ci
      - run: npm run test:tokens
      - run: npm run test:snippets
      - run: npm run test:unit
      - run: npm run test:slim
      # Commands and the language server inside a downloaded VS Code; tools that aren't installed are skipped.
      - run: xvfb-run -a npm run test:vscode
      - name: Package one .vsix per platform
        # vsce packs all of bin/, so it holds only the target's binary while that target is packaged.
        run: |
          for d in .pkg/server-*; do
            plat=${d#.pkg/server-}
            rm -rf bin && mkdir -p bin && cp -r $d bin/$plat
            npx @vscode/vsce package --target $plat --out ruby-templates-$plat.vsix
          done
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: '*.vsix' }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: '*.vsix' }
